name: Deploy Galaxy Heights

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd /home/humuser/galaxy_heights
            git pull origin main
            npm install
            npm run build
            pm2 restart galaxy_heights || pm2 start npm --name "galaxy_heights" -- run start
            pm2 save